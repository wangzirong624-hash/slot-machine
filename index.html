<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 王老师老虎机</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('casino-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: -1;
        }
        .machine {
            background: linear-gradient(145deg, rgba(139,0,0,0.95) 0%, rgba(220,20,60,0.95) 50%, rgba(139,0,0,0.95) 100%);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 100px rgba(255,215,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 3px solid #FFD700;
        }
        .title {
            color: #FFD700;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            animation: glow 2s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700; }
            50% { text-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700; }
        }
        .display {
            background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 4px solid #FFD700;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: linear-gradient(145deg, #333 0%, #222 100%);
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #444;
        }
        .reel-window {
            width: 100px;
            height: 100px;
            background: #fff;
            border-radius: 10px;
            border: 3px solid #FFD700;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .reel-strip {
            position: absolute;
            width: 100%;
            top: 0;
            will-change: transform;
        }
        .symbol {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            background: linear-gradient(145deg, #fff 0%, #f0f0f0 100%);
            border-bottom: 1px solid #ddd;
        }
        .symbol-blur {
            filter: blur(2px);
        }
        .info {
            display: flex;
            justify-content: space-between;
            color: #FFD700;
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .bet-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 25px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-bet {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
        }
        .btn-bet:hover {
            transform: scale(1.05) translateY(-2px);
        }
        .btn-bet.active {
            background: linear-gradient(145deg, #FFD700, #FFA500);
            color: #000;
        }
        .btn-spin {
            background: linear-gradient(145deg, #FF6B6B, #EE5A6F);
            color: white;
            font-size: 1.5em;
            padding: 20px 40px;
            border: 2px solid #FFD700;
        }
        .btn-spin:hover {
            transform: scale(1.05) translateY(-3px);
        }
        .btn-spin:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            text-align: center;
            color: #FFD700;
            font-size: 1.4em;
            min-height: 30px;
            margin-top: 15px;
            font-weight: bold;
        }
        .message.win { color: #00FF00; }
        .message.lose { color: #FF6B6B; }
        .paytable {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 10px;
            color: #FFD700;
            border: 2px solid #FFD700;
        }
        .paytable h3 { text-align: center; margin-bottom: 10px; }
        .paytable-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,215,0,0.3);
        }
        @media (max-width: 600px) {
            .reel-window, .symbol { width: 80px; height: 80px; }
            .symbol { font-size: 2.5em; }
            .title { font-size: 2em; }
        }
    </style>
</head>
<body>
    <div class="machine">
        <h1 class="title">🎰 王老师老虎机</h1>
        <div class="display">
            <div class="reels-container">
                <div class="reel-window">
                    <div class="reel-strip" id="reel1"><div class="symbol">🎰</div></div>
                </div>
                <div class="reel-window">
                    <div class="reel-strip" id="reel2"><div class="symbol">🎰</div></div>
                </div>
                <div class="reel-window">
                    <div class="reel-strip" id="reel3"><div class="symbol">🎰</div></div>
                </div>
            </div>
            <div class="info">
                <span>💰 余额: $<span id="balance">1000</span></span>
                <span>🎯 下注: $<span id="currentBet">10</span></span>
            </div>
        </div>
        <div class="controls">
            <div class="bet-controls">
                <button class="btn btn-bet" onclick="setBet(5)">$5</button>
                <button class="btn btn-bet active" onclick="setBet(10)">$10</button>
                <button class="btn btn-bet" onclick="setBet(25)">$25</button>
                <button class="btn btn-bet" onclick="setBet(50)">$50</button>
                <button class="btn btn-bet" onclick="setBet(100)">$100</button>
            </div>
            <button class="btn btn-spin" id="spinBtn" onclick="spin()">🎲 开始旋转</button>
            <div class="message" id="message">选择下注金额，点击旋转！</div>
        </div>
        <div class="paytable">
            <h3>📋 赔率表</h3>
            <div class="paytable-item"><span>🎰🎰🎰 777</span><span>50倍</span></div>
            <div class="paytable-item"><span>💎💎💎 钻石</span><span>20倍</span></div>
            <div class="paytable-item"><span>7️⃣7️⃣7️⃣ 数字7</span><span>10倍</span></div>
            <div class="paytable-item"><span>🍒🍒🍒 樱桃</span><span>5倍</span></div>
            <div class="paytable-item"><span>🍋🍋🍋 柠檬</span><span>3倍</span></div>
            <div class="paytable-item"><span>🍊🍊🍊 橙子</span><span>2倍</span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        let balance = 1000, currentBet = 10, spinning = false;
        const symbols = ['🎰', '💎', '7️⃣', '🍒', '🍋', '🍊', '🍇', '🔔'];
        const payouts = { '🎰🎰🎰': 50, '💎💎💎': 20, '7️⃣7️⃣7️⃣': 10, '🍒🍒🍒': 5, '🍋🍋🍋': 3, '🍊🍊🍊': 2 };
        
        function setBet(amount) {
            if (spinning) return;
            currentBet = amount;
            document.getElementById('currentBet').textContent = amount;
            document.querySelectorAll('.btn-bet').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function getRandomSymbol() {
            const weights = [0.03, 0.06, 0.09, 0.18, 0.22, 0.24, 0.15, 0.03];
            let r = Math.random(), sum = 0;
            for (let i = 0; i < symbols.length; i++) {
                sum += weights[i];
                if (r <= sum) return symbols[i];
            }
            return symbols[0];
        }
        
        // 创建滚轮条带 - 15个随机符号 + 1个结果符号
        function createStrip(finalSymbol) {
            let html = '';
            for (let i = 0; i < 15; i++) {
                html += `<div class="symbol symbol-blur">${getRandomSymbol()}</div>`;
            }
            html += `<div class="symbol">${finalSymbol}</div>`;
            return html;
        }
        
        // 滚动单个滚轮
        function spinReel(reel, duration, finalSymbol) {
            return new Promise(resolve => {
                // 创建条带
                reel.innerHTML = createStrip(finalSymbol);
                const symbolHeight = 100;
                const totalSymbols = 16; // 15个随机 + 1个结果
                const endPosition = (totalSymbols - 1) * symbolHeight; // 停在最后一个（结果）
                
                const startTime = Date.now();
                
                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // 缓动：ease-out-cubic (开始快，结束慢)
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const position = endPosition * easeOut;
                    
                    reel.style.transform = `translateY(-${position}px)`;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        // 动画完成，只显示最终结果
                        reel.innerHTML = `<div class="symbol">${finalSymbol}</div>`;
                        reel.style.transform = 'translateY(0)';
                        resolve();
                    }
                }
                
                animate();
            });
        }
        
        async function spin() {
            if (spinning) return;
            if (balance < currentBet) {
                showMessage('余额不足！', 'lose');
                return;
            }
            
            spinning = true;
            balance -= currentBet;
            updateDisplay();
            
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.textContent = '🎲 旋转中...';
            showMessage('祝你好运！🍀');
            
            // 生成最终结果（预先决定）
            const result1 = getRandomSymbol();
            const result2 = getRandomSymbol();
            const result3 = getRandomSymbol();
            
            // 滚动时间（错开停止）
            const duration1 = 1800;
            const duration2 = 2400;
            const duration3 = 3000;
            
            // 同时开始滚动，按顺序停止
            await Promise.all([
                spinReel(document.getElementById('reel1'), duration1, result1),
                new Promise(r => setTimeout(() => spinReel(document.getElementById('reel2'), duration2, result2).then(r), 300)),
                new Promise(r => setTimeout(() => spinReel(document.getElementById('reel3'), duration3, result3).then(r), 600))
            ]);
            
            checkWin([result1, result2, result3]);
            
            spinning = false;
            btn.disabled = false;
            btn.textContent = '🎲 开始旋转';
            
            if (balance <= 0) {
                setTimeout(() => {
                    if (confirm('💸 破产了！要重新开始吗？')) {
                        balance = 1000;
                        updateDisplay();
                        showMessage('重新开始！余额 $1000');
                    }
                }, 1000);
            }
        }
        
        function checkWin(results) {
            const combo = results.join('');
            const [a, b, c] = results;
            let winAmount = 0, message = '', multiplier = 0;
            
            if (payouts[combo]) {
                multiplier = payouts[combo];
                winAmount = currentBet * multiplier;
                message = `🎉 大奖！${combo}！赢得 $${winAmount}！`;
            } else if (a === b || b === c || a === c) {
                multiplier = 1;
                winAmount = currentBet;
                message = `🙂 小奖！返还 $${winAmount}`;
            } else {
                message = '😔 没有中奖，再试一次！';
            }
            
            if (winAmount > 0) {
                balance += winAmount;
                showMessage(message, 'win');
                launchFireworks(multiplier);
            } else {
                showMessage(message, 'lose');
            }
            updateDisplay();
        }
        
        function launchFireworks(m) {
            if (m >= 50) {
                const end = Date.now() + 3000;
                const colors = ['#FFD700', '#FF6B6B', '#4CAF50', '#2196F3'];
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
                setTimeout(() => confetti({ particleCount: 150, spread: 180, origin: { y: 0.6 }, colors }), 500);
            } else if (m >= 20) {
                confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 }, colors: ['#FFD700', '#FFA500'] });
            } else if (m >= 10) {
                confetti({ particleCount: 60, spread: 80, origin: { y: 0.6 }, colors: ['#4CAF50', '#2196F3'] });
            } else if (m >= 5) {
                confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 }, colors: ['#4CAF50'] });
            } else {
                confetti({ particleCount: 25, spread: 50, origin: { y: 0.8 } });
            }
        }
        
        function showMessage(msg, type = '') {
            document.getElementById('message').textContent = msg;
            document.getElementById('message').className = 'message ' + type;
        }
        
        function updateDisplay() {
            document.getElementById('balance').textContent = balance;
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); spin(); }
        });
    </script>
</body>
</html>

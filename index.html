<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 王老师老虎机</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('casino-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        /* 暗色遮罩 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: -1;
        }
        
        /* 主机器 - 现代赌场蓝色霓虹风格 */
        .machine {
            background: linear-gradient(145deg, 
                #0a0a1a 0%, 
                #1a1a2e 30%,
                #0f0f1e 70%,
                #050510 100%);
            border-radius: 30px;
            padding: 40px 35px;
            box-shadow: 
                0 0 80px rgba(0,150,255,0.4),
                0 0 150px rgba(0,100,200,0.2),
                inset 0 0 60px rgba(0,0,0,0.8),
                inset 0 0 30px rgba(0,150,255,0.1);
            max-width: 520px;
            width: 100%;
            text-align: center;
            border: 6px solid transparent;
            border-image: linear-gradient(180deg, 
                #00d4ff 0%, 
                #0099cc 50%, 
                #006699 100%) 1;
            position: relative;
        }
        
        /* 顶部蓝色霓虹灯条 */
        .machine::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 10%;
            right: 10%;
            height: 6px;
            background: linear-gradient(90deg, 
                transparent, 
                #00d4ff, 
                #00aaff, 
                #00d4ff, 
                transparent);
            box-shadow: 0 0 30px #00d4ff, 0 0 60px #0099cc;
            animation: bluePulse 2s ease-in-out infinite;
        }
        
        @keyframes bluePulse {
            0%, 100% { opacity: 0.6; box-shadow: 0 0 20px #00d4ff; }
            50% { opacity: 1; box-shadow: 0 0 40px #00d4ff, 0 0 80px #0099cc; }
        }
        
        /* 标题 - 蓝色霓虹 */
        .title {
            font-family: 'Arial', sans-serif;
            color: #00d4ff;
            font-size: 2.4em;
            margin: 15px 0 25px;
            text-shadow: 
                0 0 10px #00d4ff,
                0 0 20px #00aaff,
                0 0 40px #0099cc,
                0 0 80px rgba(0,150,255,0.5);
            animation: blueNeon 2s ease-in-out infinite alternate;
            letter-spacing: 8px;
            font-weight: bold;
        }
        
        @keyframes blueNeon {
            from { text-shadow: 0 0 10px #00d4ff, 0 0 20px #00aaff; }
            to { text-shadow: 0 0 20px #00d4ff, 0 0 40px #00aaff, 0 0 60px #0099cc; }
        }
        
        /* 显示屏区域 - 蓝色霓虹 */
        .display {
            background: linear-gradient(145deg, #050510 0%, #0a0a1a 50%, #050510 100%);
            border-radius: 20px;
            padding: 25px 20px;
            margin-bottom: 25px;
            border: 4px solid #00d4ff;
            box-shadow: 
                inset 0 0 30px rgba(0,0,0,0.9),
                0 0 30px rgba(0,212,255,0.3),
                inset 0 0 15px rgba(0,212,255,0.1);
            position: relative;
        }
        
        .display::before {
            content: 'WINNER';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(145deg, #00d4ff, #0099cc);
            color: #000;
            padding: 3px 25px;
            font-size: 0.8em;
            font-weight: bold;
            border-radius: 10px;
            letter-spacing: 4px;
            box-shadow: 0 0 20px rgba(0,212,255,0.6);
        }
        
        /* 滚轮容器 - 黑色金属 */
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            background: linear-gradient(145deg, 
                #1a1a2e 0%, 
                #0f0f1e 50%, 
                #0a0a1a 100%);
            padding: 18px;
            border-radius: 15px;
            border: 3px solid #1a3a5c;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.9),
                0 5px 15px rgba(0,0,0,0.5),
                0 0 20px rgba(0,150,255,0.1);
        }
        
        /* 单个滚轮窗口 - 蓝色霓虹边框 */
        .reel-window {
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, #fff 0%, #e8e8e8 100%);
            border-radius: 12px;
            border: 4px solid #00d4ff;
            overflow: hidden;
            position: relative;
            box-shadow: 
                0 0 20px rgba(0,212,255,0.4),
                inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .reel-window::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                180deg,
                rgba(0,0,0,0.4) 0%,
                transparent 20%,
                transparent 80%,
                rgba(0,0,0,0.4) 100%
            );
            pointer-events: none;
            z-index: 10;
        }
        
        .reel-strip {
            position: absolute;
            width: 100%;
            top: 0;
            will-change: transform;
        }
        
        .symbol {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            background: linear-gradient(145deg, #fff 0%, #f5f5f5 50%, #e8e8e8 100%);
            border-bottom: 2px solid #ddd;
        }
        
        .symbol-blur {
            filter: blur(3px);
        }
        
        /* 信息栏 - 蓝色霓虹 */
        .info {
            display: flex;
            justify-content: space-between;
            color: #00d4ff;
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,212,255,0.5);
            padding: 0 5px;
        }
        
        .info span {
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 10px;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 15px rgba(0,212,255,0.2);
        }
        
        /* 下注按钮 - 蓝色霓虹 */
        .bet-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .btn-bet {
            width: 65px;
            height: 45px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(145deg, 
                #1a1a2e 0%, 
                #0f0f1e 50%, 
                #0a0a1a 100%);
            color: #6688aa;
            border: 2px solid #1a3a5c;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }
        
        .btn-bet:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-color: #00aaff;
        }
        
        .btn-bet.active {
            background: linear-gradient(145deg, 
                #00d4ff 0%, 
                #0099cc 50%, 
                #006699 100%);
            color: #000;
            border-color: #00d4ff;
            box-shadow: 
                0 0 20px rgba(0,212,255,0.6),
                0 0 40px rgba(0,170,255,0.3);
            text-shadow: none;
        }
        
        /* 旋转按钮 - 蓝色霓虹 */
        .btn-spin {
            width: 100%;
            padding: 22px;
            font-size: 1.6em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(145deg, 
                #0066cc 0%, 
                #004499 50%, 
                #002266 100%);
            color: #00d4ff;
            border: 3px solid #00d4ff;
            box-shadow: 
                0 0 30px rgba(0,100,200,0.5),
                0 10px 30px rgba(0,0,0,0.4),
                inset 0 0 20px rgba(255,255,255,0.1);
            text-shadow: 0 0 10px rgba(0,212,255,0.8);
            transition: all 0.2s;
            letter-spacing: 5px;
        }
        
        .btn-spin:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 
                0 0 50px rgba(0,150,255,0.6),
                0 15px 40px rgba(0,0,0,0.5),
                inset 0 0 30px rgba(255,255,255,0.2);
        }
        
        .btn-spin:disabled {
            background: #1a1a2e;
            color: #334466;
            border-color: #334466;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            text-shadow: none;
        }
        
        /* 消息显示 - 蓝色霓虹 */
        .message {
            text-align: center;
            color: #00d4ff;
            font-size: 1.4em;
            min-height: 40px;
            margin-top: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,212,255,0.5);
        }
        
        .message.win { 
            color: #00ff88; 
            text-shadow: 0 0 20px rgba(0,255,136,0.8);
            animation: winnerPulse 0.5s ease-in-out 3;
        }
        
        .message.lose { 
            color: #ff6688;
            text-shadow: 0 0 10px rgba(255,100,130,0.5);
        }
        
        @keyframes winnerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* 赔率表 - 蓝色霓虹 */
        .paytable {
            margin-top: 20px;
            padding: 18px;
            background: linear-gradient(145deg, 
                rgba(5,5,15,0.8) 0%, 
                rgba(10,10,25,0.9) 100%);
            border-radius: 15px;
            border: 3px solid #00d4ff;
            box-shadow: 
                0 0 20px rgba(0,212,255,0.2),
                inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        .paytable h3 {
            color: #00d4ff;
            text-align: center;
            margin-bottom: 12px;
            font-size: 1.2em;
            text-shadow: 0 0 10px rgba(0,212,255,0.5);
        }
        
        .paytable-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0,212,255,0.2);
            color: #aaddff;
            font-size: 1em;
        }
        
        .paytable-item:last-child {
            border-bottom: none;
        }
        
        .paytable-item span:last-child {
            color: #ff6688;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255,100,130,0.5);
        }
        
        @media (max-width: 600px) {
            .machine { padding: 35px 20px; }
            .title { font-size: 1.8em; letter-spacing: 4px; }
            .reel-window, .symbol { width: 80px; height: 80px; }
            .symbol { font-size: 2.5em; }
            .btn-bet { width: 55px; height: 40px; font-size: 0.9em; }
            .btn-spin { font-size: 1.3em; padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="machine">
        <h1 class="title">王老师老虎机</h1>
        
        <div class="display">
            <div class="reels-container">
                <div class="reel-window">
                    <div class="reel-strip" id="reel1"><div class="symbol">🎰</div></div>
                </div>
                <div class="reel-window">
                    <div class="reel-strip" id="reel2"><div class="symbol">🎰</div></div>
                </div>
                <div class="reel-window">
                    <div class="reel-strip" id="reel3"><div class="symbol">🎰</div></div>
                </div>
            </div>
            <div class="info">
                <span>💰 $<span id="balance">1000</span></span>
                <span>🎯 $<span id="currentBet">10</span></span>
            </div>
        </div>
        
        <div class="controls">
            <div class="bet-controls">
                <button class="btn-bet" onclick="setBet(5)">$5</button>
                <button class="btn-bet active" onclick="setBet(10)">$10</button>
                <button class="btn-bet" onclick="setBet(25)">$25</button>
                <button class="btn-bet" onclick="setBet(50)">$50</button>
                <button class="btn-bet" onclick="setBet(100)">$100</button>
            </div>
            
            <button class="btn-spin" id="spinBtn" onclick="spin()">🎰 SPIN 🎰</button>
            
            <div class="message" id="message">选择下注金额，点击旋转！</div>
        </div>
        
        <div class="paytable">
            <h3>📋 赔率表</h3>
            <div class="paytable-item"><span>🎰🎰🎰 777</span><span>50x</span></div>
            <div class="paytable-item"><span>💎💎💎 钻石</span><span>20x</span></div>
            <div class="paytable-item"><span>7️⃣7️⃣7️⃣ 数字7</span><span>10x</span></div>
            <div class="paytable-item"><span>🍒🍒🍒 樱桃</span><span>5x</span></div>
            <div class="paytable-item"><span>🍋🍋🍋 柠檬</span><span>3x</span></div>
            <div class="paytable-item"><span>🍊🍊🍊 橙子</span><span>2x</span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        let balance = 1000, currentBet = 10, spinning = false;
        const symbols = ['🎰', '💎', '7️⃣', '🍒', '🍋', '🍊', '🍇', '🔔'];
        const payouts = { '🎰🎰🎰': 50, '💎💎💎': 20, '7️⃣7️⃣7️⃣': 10, '🍒🍒🍒': 5, '🍋🍋🍋': 3, '🍊🍊🍊': 2 };
        
        function setBet(amount) {
            if (spinning) return;
            currentBet = amount;
            document.getElementById('currentBet').textContent = amount;
            document.querySelectorAll('.btn-bet').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function getRandomSymbol() {
            const weights = [0.03, 0.06, 0.09, 0.18, 0.22, 0.24, 0.15, 0.03];
            let r = Math.random(), sum = 0;
            for (let i = 0; i < symbols.length; i++) {
                sum += weights[i];
                if (r <= sum) return symbols[i];
            }
            return symbols[0];
        }
        
        function createStrip(finalSymbol) {
            let html = '';
            for (let i = 0; i < 15; i++) {
                html += `<div class="symbol symbol-blur">${getRandomSymbol()}</div>`;
            }
            html += `<div class="symbol">${finalSymbol}</div>`;
            return html;
        }
        
        function spinReel(reel, duration, finalSymbol) {
            return new Promise(resolve => {
                reel.innerHTML = createStrip(finalSymbol);
                const symbolHeight = 110;
                const endPosition = 15 * symbolHeight;
                const startTime = Date.now();
                
                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const position = endPosition * easeOut;
                    
                    reel.style.transform = `translateY(-${position}px)`;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        reel.innerHTML = `<div class="symbol">${finalSymbol}</div>`;
                        reel.style.transform = 'translateY(0)';
                        resolve();
                    }
                }
                animate();
            });
        }
        
        async function spin() {
            if (spinning) return;
            if (balance < currentBet) {
                showMessage('余额不足！', 'lose');
                return;
            }
            
            spinning = true;
            balance -= currentBet;
            updateDisplay();
            
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.textContent = '旋转中...';
            showMessage('祝你好运！🍀');
            
            const result1 = getRandomSymbol();
            const result2 = getRandomSymbol();
            const result3 = getRandomSymbol();
            
            await Promise.all([
                spinReel(document.getElementById('reel1'), 1800, result1),
                new Promise(r => setTimeout(() => spinReel(document.getElementById('reel2'), 2400, result2).then(r), 300)),
                new Promise(r => setTimeout(() => spinReel(document.getElementById('reel3'), 3000, result3).then(r), 600))
            ]);
            
            checkWin([result1, result2, result3]);
            
            spinning = false;
            btn.disabled = false;
            btn.textContent = '🎰 SPIN 🎰';
            
            if (balance <= 0) {
                setTimeout(() => {
                    if (confirm('💸 破产了！要重新开始吗？')) {
                        balance = 1000;
                        updateDisplay();
                        showMessage('重新开始！余额 $1000');
                    }
                }, 1000);
            }
        }
        
        function checkWin(results) {
            const combo = results.join('');
            const [a, b, c] = results;
            let winAmount = 0, message = '', multiplier = 0;
            
            if (payouts[combo]) {
                multiplier = payouts[combo];
                winAmount = currentBet * multiplier;
                message = `🎉 大奖！${combo}！赢得 $${winAmount}！`;
            } else if (a === b || b === c || a === c) {
                multiplier = 1;
                winAmount = currentBet;
                message = `🙂 小奖！返还 $${winAmount}`;
            } else {
                message = '😔 没有中奖，再试一次！';
            }
            
            if (winAmount > 0) {
                balance += winAmount;
                showMessage(message, 'win');
                launchFireworks(multiplier);
            } else {
                showMessage(message, 'lose');
            }
            updateDisplay();
        }
        
        function launchFireworks(m) {
            if (m >= 50) {
                const end = Date.now() + 3000;
                const colors = ['#FFD700', '#FF6B6B', '#4CAF50', '#2196F3'];
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
                setTimeout(() => confetti({ particleCount: 150, spread: 180, origin: { y: 0.6 }, colors }), 500);
            } else if (m >= 20) {
                confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 }, colors: ['#FFD700', '#FFA500'] });
            } else if (m >= 10) {
                confetti({ particleCount: 60, spread: 80, origin: { y: 0.6 }, colors: ['#4CAF50', '#2196F3'] });
            } else if (m >= 5) {
                confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 }, colors: ['#4CAF50'] });
            } else {
                confetti({ particleCount: 25, spread: 50, origin: { y: 0.8 } });
            }
        }
        
        function showMessage(msg, type = '') {
            document.getElementById('message').textContent = msg;
            document.getElementById('message').className = 'message ' + type;
        }
        
        function updateDisplay() {
            document.getElementById('balance').textContent = balance;
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); spin(); }
        });
    </script>
</body>
</html>

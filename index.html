<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 王老师老虎机</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background: 
                radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1e 50%, #000 100%),
                linear-gradient(45deg, #1a1a2e 25%, transparent 25%),
                linear-gradient(-45deg, #1a1a2e 25%, transparent 25%);
            background-size: 100% 100%, 60px 60px, 60px 60px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        /* 背景闪烁效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255,215,0,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255,107,107,0.1) 0%, transparent 50%);
            animation: bgPulse 4s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        /* 主机器 - 金碧辉煌 */
        .machine {
            background: linear-gradient(145deg, 
                #1a0a00 0%, 
                #3d1f00 15%,
                #5c2e00 30%,
                #8B4513 50%,
                #5c2e00 70%,
                #3d1f00 85%,
                #1a0a00 100%);
            border-radius: 40px;
            padding: 50px 40px;
            box-shadow: 
                0 0 60px rgba(255,215,0,0.3),
                0 0 120px rgba(255,215,0,0.1),
                inset 0 0 60px rgba(0,0,0,0.5),
                inset 0 0 20px rgba(255,215,0,0.2);
            max-width: 550px;
            width: 100%;
            text-align: center;
            border: 8px solid transparent;
            border-image: linear-gradient(145deg, 
                #FFD700 0%, 
                #FFA500 25%, 
                #FFD700 50%, 
                #FFA500 75%, 
                #FFD700 100%) 1;
            position: relative;
        }
        
        /* 顶部装饰灯 */
        .machine::before {
            content: '💎 🎰 💎 🎰 💎';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(145deg, #1a0a00, #3d1f00);
            padding: 5px 30px;
            border-radius: 20px;
            border: 3px solid #FFD700;
            font-size: 1.2em;
            letter-spacing: 10px;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
            animation: lightBlink 1s ease-in-out infinite alternate;
        }
        
        @keyframes lightBlink {
            from { text-shadow: 0 0 10px #FFD700; }
            to { text-shadow: 0 0 30px #FFD700, 0 0 60px #FFA500; }
        }
        
        /* 标题 - 金色霓虹 */
        .title {
            font-family: 'Cinzel', serif;
            color: #FFD700;
            font-size: 2.8em;
            margin: 20px 0 30px;
            text-shadow: 
                0 0 10px #FFD700,
                0 0 20px #FFD700,
                0 0 40px #FFA500,
                0 0 80px rgba(255,165,0,0.5);
            animation: neonGlow 1.5s ease-in-out infinite alternate;
            letter-spacing: 5px;
        }
        
        @keyframes neonGlow {
            from { 
                text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700, 0 0 40px #FFA500;
            }
            to { 
                text-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700, 0 0 60px #FFA500, 0 0 100px rgba(255,165,0,0.8);
            }
        }
        
        /* 显示屏区域 */
        .display {
            background: linear-gradient(145deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            border-radius: 20px;
            padding: 30px 25px;
            margin-bottom: 30px;
            border: 5px solid #FFD700;
            box-shadow: 
                inset 0 0 30px rgba(0,0,0,0.8),
                0 0 30px rgba(255,215,0,0.3),
                inset 0 0 10px rgba(255,215,0,0.1);
            position: relative;
        }
        
        .display::before {
            content: 'WINNER';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFD700;
            color: #000;
            padding: 3px 20px;
            font-size: 0.8em;
            font-weight: bold;
            border-radius: 10px;
            letter-spacing: 3px;
        }
        
        /* 滚轮容器 - 金属质感 */
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            background: linear-gradient(145deg, 
                #2a2a2a 0%, 
                #1a1a1a 50%, 
                #0a0a0a 100%);
            padding: 20px;
            border-radius: 15px;
            border: 4px solid #444;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.8),
                0 5px 15px rgba(0,0,0,0.5);
        }
        
        /* 单个滚轮窗口 - 金属边框 */
        .reel-window {
            width: 110px;
            height: 110px;
            background: linear-gradient(145deg, #fff 0%, #e8e8e8 100%);
            border-radius: 15px;
            border: 5px solid #FFD700;
            overflow: hidden;
            position: relative;
            box-shadow: 
                0 0 20px rgba(255,215,0,0.3),
                inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .reel-window::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                180deg,
                rgba(0,0,0,0.3) 0%,
                transparent 20%,
                transparent 80%,
                rgba(0,0,0,0.3) 100%
            );
            pointer-events: none;
            z-index: 10;
        }
        
        .reel-strip {
            position: absolute;
            width: 100%;
            top: 0;
            will-change: transform;
        }
        
        .symbol {
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5em;
            background: linear-gradient(145deg, #fff 0%, #f5f5f5 50%, #e8e8e8 100%);
            border-bottom: 2px solid #ddd;
        }
        
        .symbol-blur {
            filter: blur(3px);
        }
        
        /* 信息栏 - 金色数字 */
        .info {
            display: flex;
            justify-content: space-between;
            color: #FFD700;
            font-size: 1.3em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            padding: 0 10px;
        }
        
        .info span {
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 10px;
            border: 2px solid #FFD700;
        }
        
        /* 下注按钮 - 宝石风格 */
        .bet-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .btn-bet {
            width: 70px;
            height: 50px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(145deg, 
                #4a4a4a 0%, 
                #2a2a2a 50%, 
                #1a1a1a 100%);
            color: #aaa;
            border: 3px solid #666;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        
        .btn-bet:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border-color: #888;
        }
        
        .btn-bet.active {
            background: linear-gradient(145deg, 
                #FFD700 0%, 
                #FFA500 50%, 
                #FF8C00 100%);
            color: #000;
            border-color: #FFD700;
            box-shadow: 
                0 0 20px rgba(255,215,0,0.5),
                0 0 40px rgba(255,165,0,0.3);
            text-shadow: none;
        }
        
        /* 旋转按钮 - 大红宝石 */
        .btn-spin {
            width: 100%;
            padding: 25px;
            font-size: 1.8em;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background: linear-gradient(145deg, 
                #ff4d4d 0%, 
                #cc0000 50%, 
                #990000 100%);
            color: #FFD700;
            border: 4px solid #FFD700;
            box-shadow: 
                0 0 30px rgba(255,0,0,0.5),
                0 10px 30px rgba(0,0,0,0.4),
                inset 0 0 20px rgba(255,255,255,0.2);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.2s;
            letter-spacing: 3px;
        }
        
        .btn-spin:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 
                0 0 50px rgba(255,0,0,0.6),
                0 15px 40px rgba(0,0,0,0.5),
                inset 0 0 30px rgba(255,255,255,0.3);
        }
        
        .btn-spin:disabled {
            background: #444;
            color: #666;
            border-color: #666;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 消息显示 */
        .message {
            text-align: center;
            color: #FFD700;
            font-size: 1.5em;
            min-height: 40px;
            margin-top: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        
        .message.win { 
            color: #00FF00; 
            text-shadow: 0 0 20px rgba(0,255,0,0.8);
            animation: winnerPulse 0.5s ease-in-out 3;
        }
        
        .message.lose { 
            color: #FF6B6B;
            text-shadow: 0 0 10px rgba(255,107,107,0.5);
        }
        
        @keyframes winnerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* 赔率表 */
        .paytable {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(145deg, 
                rgba(0,0,0,0.7) 0%, 
                rgba(20,20,20,0.8) 100%);
            border-radius: 15px;
            border: 3px solid #FFD700;
            box-shadow: 0 0 20px rgba(255,215,0,0.2);
        }
        
        .paytable h3 {
            color: #FFD700;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.3em;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        
        .paytable-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            color: #FFD700;
            font-size: 1.1em;
        }
        
        .paytable-item:last-child {
            border-bottom: none;
        }
        
        .paytable-item span:last-child {
            color: #FF6B6B;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255,107,107,0.5);
        }
        
        @media (max-width: 600px) {
            .machine { padding: 40px 20px; }
            .title { font-size: 2em; }
            .reel-window, .symbol { width: 85px; height: 85px; }
            .symbol { font-size: 2.8em; }
            .btn-bet { width: 55px; height: 45px; font-size: 0.9em; }
            .btn-spin { font-size: 1.4em; padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="machine">
        <h1 class="title">王老师老虎机</h1>
        
        <div class="display">
            <div class="reels-container">
                <div class="reel-window">
                    <div class="reel-strip" id="reel1"><div class="symbol">🎰</div></div>
                </div>
                <div class="reel-window">
                    <div class="reel-strip" id="reel2"><div class="symbol">🎰</div></div>
                </div>
                <div class="reel-window">
                    <div class="reel-strip" id="reel3"><div class="symbol">🎰</div></div>
                </div>
            </div>
            <div class="info">
                <span>💰 $<span id="balance">1000</span></span>
                <span>🎯 $<span id="currentBet">10</span></span>
            </div>
        </div>
        
        <div class="controls">
            <div class="bet-controls">
                <button class="btn-bet" onclick="setBet(5)">$5</button>
                <button class="btn-bet active" onclick="setBet(10)">$10</button>
                <button class="btn-bet" onclick="setBet(25)">$25</button>
                <button class="btn-bet" onclick="setBet(50)">$50</button>
                <button class="btn-bet" onclick="setBet(100)">$100</button>
            </div>
            
            <button class="btn-spin" id="spinBtn" onclick="spin()">🎰 SPIN 🎰</button>
            
            <div class="message" id="message">选择下注金额，点击旋转！</div>
        </div>
        
        <div class="paytable">
            <h3>📋 赔率表</h3>
            <div class="paytable-item"><span>🎰🎰🎰 777</span><span>50x</span></div>
            <div class="paytable-item"><span>💎💎💎 钻石</span><span>20x</span></div>
            <div class="paytable-item"><span>7️⃣7️⃣7️⃣ 数字7</span><span>10x</span></div>
            <div class="paytable-item"><span>🍒🍒🍒 樱桃</span><span>5x</span></div>
            <div class="paytable-item"><span>🍋🍋🍋 柠檬</span><span>3x</span></div>
            <div class="paytable-item"><span>🍊🍊🍊 橙子</span><span>2x</span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        let balance = 1000, currentBet = 10, spinning = false;
        const symbols = ['🎰', '💎', '7️⃣', '🍒', '🍋', '🍊', '🍇', '🔔'];
        const payouts = { '🎰🎰🎰': 50, '💎💎💎': 20, '7️⃣7️⃣7️⃣': 10, '🍒🍒🍒': 5, '🍋🍋🍋': 3, '🍊🍊🍊': 2 };
        
        function setBet(amount) {
            if (spinning) return;
            currentBet = amount;
            document.getElementById('currentBet').textContent = amount;
            document.querySelectorAll('.btn-bet').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function getRandomSymbol() {
            const weights = [0.03, 0.06, 0.09, 0.18, 0.22, 0.24, 0.15, 0.03];
            let r = Math.random(), sum = 0;
            for (let i = 0; i < symbols.length; i++) {
                sum += weights[i];
                if (r <= sum) return symbols[i];
            }
            return symbols[0];
        }
        
        function createStrip(finalSymbol) {
            let html = '';
            for (let i = 0; i < 15; i++) {
                html += `<div class="symbol symbol-blur">${getRandomSymbol()}</div>`;
            }
            html += `<div class="symbol">${finalSymbol}</div>`;
            return html;
        }
        
        function spinReel(reel, duration, finalSymbol) {
            return new Promise(resolve => {
                reel.innerHTML = createStrip(finalSymbol);
                const symbolHeight = 110;
                const endPosition = 15 * symbolHeight;
                const startTime = Date.now();
                
                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const position = endPosition * easeOut;
                    
                    reel.style.transform = `translateY(-${position}px)`;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        reel.innerHTML = `<div class="symbol">${finalSymbol}</div>`;
                        reel.style.transform = 'translateY(0)';
                        resolve();
                    }
                }
                animate();
            });
        }
        
        async function spin() {
            if (spinning) return;
            if (balance < currentBet) {
                showMessage('余额不足！', 'lose');
                return;
            }
            
            spinning = true;
            balance -= currentBet;
            updateDisplay();
            
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.textContent = '旋转中...';
            showMessage('祝你好运！🍀');
            
            const result1 = getRandomSymbol();
            const result2 = getRandomSymbol();
            const result3 = getRandomSymbol();
            
            await Promise.all([
                spinReel(document.getElementById('reel1'), 1800, result1),
                new Promise(r => setTimeout(() => spinReel(document.getElementById('reel2'), 2400, result2).then(r), 300)),
                new Promise(r => setTimeout(() => spinReel(document.getElementById('reel3'), 3000, result3).then(r), 600))
            ]);
            
            checkWin([result1, result2, result3]);
            
            spinning = false;
            btn.disabled = false;
            btn.textContent = '🎰 SPIN 🎰';
            
            if (balance <= 0) {
                setTimeout(() => {
                    if (confirm('💸 破产了！要重新开始吗？')) {
                        balance = 1000;
                        updateDisplay();
                        showMessage('重新开始！余额 $1000');
                    }
                }, 1000);
            }
        }
        
        function checkWin(results) {
            const combo = results.join('');
            const [a, b, c] = results;
            let winAmount = 0, message = '', multiplier = 0;
            
            if (payouts[combo]) {
                multiplier = payouts[combo];
                winAmount = currentBet * multiplier;
                message = `🎉 大奖！${combo}！赢得 $${winAmount}！`;
            } else if (a === b || b === c || a === c) {
                multiplier = 1;
                winAmount = currentBet;
                message = `🙂 小奖！返还 $${winAmount}`;
            } else {
                message = '😔 没有中奖，再试一次！';
            }
            
            if (winAmount > 0) {
                balance += winAmount;
                showMessage(message, 'win');
                launchFireworks(multiplier);
            } else {
                showMessage(message, 'lose');
            }
            updateDisplay();
        }
        
        function launchFireworks(m) {
            if (m >= 50) {
                const end = Date.now() + 3000;
                const colors = ['#FFD700', '#FF6B6B', '#4CAF50', '#2196F3'];
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
                setTimeout(() => confetti({ particleCount: 150, spread: 180, origin: { y: 0.6 }, colors }), 500);
            } else if (m >= 20) {
                confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 }, colors: ['#FFD700', '#FFA500'] });
            } else if (m >= 10) {
                confetti({ particleCount: 60, spread: 80, origin: { y: 0.6 }, colors: ['#4CAF50', '#2196F3'] });
            } else if (m >= 5) {
                confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 }, colors: ['#4CAF50'] });
            } else {
                confetti({ particleCount: 25, spread: 50, origin: { y: 0.8 } });
            }
        }
        
        function showMessage(msg, type = '') {
            document.getElementById('message').textContent = msg;
            document.getElementById('message').className = 'message ' + type;
        }
        
        function updateDisplay() {
            document.getElementById('balance').textContent = balance;
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); spin(); }
        });
    </script>
</body>
</html>

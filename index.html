<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 王老师老虎机</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('casino-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: -1;
        }
        
        /* 主机器外壳 - 立式弧形 */
        .machine-outer {
            background: linear-gradient(180deg, 
                #1a0a2e 0%, 
                #2d1b4e 10%,
                #1a1a2e 30%,
                #0f0f1e 70%,
                #1a0a2e 100%);
            border-radius: 150px 150px 30px 30px;
            padding: 8px;
            box-shadow: 
                0 0 50px rgba(138,43,226,0.5),
                0 0 100px rgba(75,0,130,0.3),
                inset 0 0 50px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 100%;
            position: relative;
        }
        
        /* 机器内部 */
        .machine {
            background: linear-gradient(180deg, 
                #0a0a15 0%, 
                #151525 50%,
                #0a0a15 100%);
            border-radius: 145px 145px 25px 25px;
            padding: 30px 25px 25px;
            border: 3px solid #4a0080;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        
        /* 顶部弧形霓虹灯 */
        .top-arc {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 60px;
            background: linear-gradient(180deg, 
                #ff00ff 0%,
                #9900cc 50%,
                #4a0080 100%);
            border-radius: 100px 100px 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 30px #ff00ff,
                0 0 60px #9900cc,
                inset 0 0 20px rgba(255,255,255,0.2);
            animation: purpleGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes purpleGlow {
            from { box-shadow: 0 0 20px #ff00ff, 0 0 40px #9900cc; }
            to { box-shadow: 0 0 40px #ff00ff, 0 0 80px #9900cc, 0 0 120px #4a0080; }
        }
        
        .top-arc h1 {
            color: #fff;
            font-size: 1.4em;
            text-shadow: 
                0 0 10px #fff,
                0 0 20px #ff00ff;
            letter-spacing: 3px;
            font-weight: bold;
        }
        
        /* 顶部状态灯 */
        .status-lights {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 50px 0 15px;
        }
        
        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        
        .light.on {
            background: #ff00ff;
            box-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff;
            animation: blink 0.5s ease-in-out infinite alternate;
        }
        
        @keyframes blink {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
        
        /* 主显示屏区域 */
        .main-screen {
            background: #000;
            border-radius: 20px;
            padding: 15px;
            border: 4px solid #333;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.9),
                0 0 20px rgba(0,150,255,0.2);
            margin-bottom: 15px;
        }
        
        /* 滚轮区域 */
        .reels-frame {
            background: linear-gradient(145deg, #1a1a2e, #0f0f1e);
            border-radius: 15px;
            padding: 12px;
            border: 2px solid #0066cc;
            box-shadow: 
                0 0 20px rgba(0,100,200,0.3),
                inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        
        .reel-window {
            width: 95px;
            height: 95px;
            background: linear-gradient(145deg, #fff, #e0e0e0);
            border-radius: 10px;
            border: 3px solid #0099ff;
            overflow: hidden;
            position: relative;
            box-shadow: 
                0 0 15px rgba(0,150,255,0.4),
                inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .reel-window::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg,
                rgba(0,0,0,0.3) 0%,
                transparent 15%,
                transparent 85%,
                rgba(0,0,0,0.3) 100%
            );
            z-index: 10;
            pointer-events: none;
        }
        
        .reel-strip {
            position: absolute;
            width: 100%;
            top: 0;
        }
        
        .symbol {
            width: 95px;
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            background: linear-gradient(145deg, #fff, #f0f0f0);
            border-bottom: 1px solid #ddd;
        }
        
        .symbol-blur {
            filter: blur(2px);
        }
        
        /* 信用额度显示 */
        .credit-display {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding: 8px 12px;
            background: linear-gradient(145deg, #1a0a1e, #0f050f);
            border-radius: 8px;
            border: 2px solid #ff00ff;
        }
        
        .credit-box {
            text-align: center;
        }
        
        .credit-label {
            color: #ff66ff;
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .credit-value {
            color: #fff;
            font-size: 1.3em;
            font-weight: bold;
            text-shadow: 0 0 10px #ff00ff;
        }
        
        /* 控制面板 */
        .control-panel {
            background: linear-gradient(145deg, #1a1a2e, #0f0f1e);
            border-radius: 15px;
            padding: 15px;
            border: 2px solid #333;
        }
        
        /* 下注按钮行 */
        .bet-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
        }
        
        .btn-bet {
            flex: 1;
            max-width: 60px;
            padding: 10px 5px;
            font-size: 0.85em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(145deg, #2a2a3e, #1a1a2e);
            color: #8899aa;
            border: 2px solid #444;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }
        
        .btn-bet.active {
            background: linear-gradient(145deg, #ff0066, #cc0055);
            color: #fff;
            border-color: #ff0066;
            box-shadow: 0 0 15px rgba(255,0,100,0.5);
        }
        
        /* 大按钮区域 */
        .big-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .btn-spin {
            flex: 2;
            padding: 18px;
            font-size: 1.4em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(145deg, #ff3300, #cc2200);
            color: #fff;
            border: 3px solid #ff6600;
            box-shadow: 
                0 0 20px rgba(255,50,0,0.5),
                0 5px 15px rgba(0,0,0,0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .btn-spin:disabled {
            background: #333;
            border-color: #555;
            color: #666;
            box-shadow: none;
        }
        
        .btn-max {
            flex: 1;
            padding: 15px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(145deg, #ffcc00, #ff9900);
            color: #000;
            border: 2px solid #ffdd44;
            box-shadow: 0 0 15px rgba(255,200,0,0.4);
        }
        
        /* 消息显示 */
        .message {
            text-align: center;
            color: #00ff88;
            font-size: 1.1em;
            min-height: 25px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,255,136,0.5);
        }
        
        .message.win { color: #ffdd00; text-shadow: 0 0 15px rgba(255,220,0,0.8); }
        .message.lose { color: #ff6688; }
        
        /* 底部装饰 */
        .machine-bottom {
            position: absolute;
            bottom: -10px;
            left: 10%;
            right: 10%;
            height: 20px;
            background: linear-gradient(90deg, #ff0066, #ff00ff, #6600ff);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255,0,255,0.5);
        }
        
        @media (max-width: 450px) {
            .machine { padding: 25px 15px 20px; }
            .top-arc h1 { font-size: 1.1em; }
            .reel-window, .symbol { width: 80px; height: 80px; }
            .symbol { font-size: 2.5em; }
            .btn-spin { font-size: 1.2em; padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="machine-outer">
        <div class="top-arc">
            <h1>🎰 王老师老虎机</h1>
        </div>
        
        <div class="machine">
            <!-- 顶部状态灯 -->
            <div class="status-lights">
                <div class="light on"></div>
                <div class="light"></div>
                <div class="light on"></div>
                <div class="light"></div>
                <div class="light on"></div>
            </div>
            
            <!-- 主屏幕 -->
            <div class="main-screen">
                <div class="reels-frame">
                    <div class="reels-container">
                        <div class="reel-window">
                            <div class="reel-strip" id="reel1"><div class="symbol">🎰</div></div>
                        </div>
                        <div class="reel-window">
                            <div class="reel-strip" id="reel2"><div class="symbol">🎰</div></div>
                        </div>
                        <div class="reel-window">
                            <div class="reel-strip" id="reel3"><div class="symbol">🎰</div></div>
                        </div>
                    </div>
                </div>
                
                <!-- 信用额度 -->
                <div class="credit-display">
                    <div class="credit-box">
                        <div class="credit-label">CREDIT</div>
                        <div class="credit-value" id="balance">1000</div>
                    </div>
                    <div class="credit-box">
                        <div class="credit-label">BET</div>
                        <div class="credit-value" id="currentBet">10</div>
                    </div>
                </div>
            </div>
            
            <!-- 控制面板 -->
            <div class="control-panel">
                <!-- 下注按钮 -->
                <div class="bet-row">
                    <button class="btn-bet" onclick="setBet(5)">$5</button>
                    <button class="btn-bet active" onclick="setBet(10)">$10</button>
                    <button class="btn-bet" onclick="setBet(25)">$25</button>
                    <button class="btn-bet" onclick="setBet(50)">$50</button>
                    <button class="btn-bet" onclick="setBet(100)">$100</button>
                </div>
                
                <!-- 大按钮 -->
                <div class="big-buttons">
                    <button class="btn-spin" id="spinBtn" onclick="spin()">SPIN</button>
                    <button class="btn-max" onclick="setBet(100);spin()">MAX<br>BET</button>
                </div>
                
                <!-- 消息 -->
                <div class="message" id="message">选择下注金额，点击SPIN！</div>
            </div>
        </div>
        
        <div class="machine-bottom"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        let balance = 1000, currentBet = 10, spinning = false;
        const symbols = ['🎰', '💎', '7️⃣', '🍒', '🍋', '🍊', '🍇', '🔔'];
        const payouts = { '🎰🎰🎰': 50, '💎💎💎': 20, '7️⃣7️⃣7️⃣': 10, '🍒🍒🍒': 5, '🍋🍋🍋': 3, '🍊🍊🍊': 2 };
        
        function setBet(amount) {
            if (spinning) return;
            currentBet = amount;
            document.getElementById('currentBet').textContent = amount;
            document.querySelectorAll('.btn-bet').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function getRandomSymbol() {
            const weights = [0.03, 0.06, 0.09, 0.18, 0.22, 0.24, 0.15, 0.03];
            let r = Math.random(), sum = 0;
            for (let i = 0; i < symbols.length; i++) {
                sum += weights[i];
                if (r <= sum) return symbols[i];
            }
            return symbols[0];
        }
        
        function createStrip(finalSymbol) {
            let html = '';
            for (let i = 0; i < 15; i++) {
                html += `<div class="symbol symbol-blur">${getRandomSymbol()}</div>`;
            }
            html += `<div class="symbol">${finalSymbol}</div>`;
            return html;
        }
        
        function spinReel(reel, duration, finalSymbol) {
            return new Promise(resolve => {
                reel.innerHTML = createStrip(finalSymbol);
                const symbolHeight = 95;
                const endPosition = 15 * symbolHeight;
                const startTime = Date.now();
                
                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const position = endPosition * easeOut;
                    
                    reel.style.transform = `translateY(-${position}px)`;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        reel.innerHTML = `<div class="symbol">${finalSymbol}</div>`;
                        reel.style.transform = 'translateY(0)';
                        resolve();
                    }
                }
                animate();
            });
        }
        
        async function spin() {
            if (spinning) return;
            if (balance < currentBet) {
                showMessage('余额不足！', 'lose');
                return;
            }
            
            spinning = true;
            balance -= currentBet;
            updateDisplay();
            
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.textContent = '...';
            showMessage('GOOD LUCK!');
            
            // 闪烁状态灯
            document.querySelectorAll('.light').forEach(l => l.classList.toggle('on'));
            
            const result1 = getRandomSymbol();
            const result2 = getRandomSymbol();
            const result3 = getRandomSymbol();
            
            await Promise.all([
                spinReel(document.getElementById('reel1'), 1800, result1),
                new Promise(r => setTimeout(() => spinReel(document.getElementById('reel2'), 2400, result2).then(r), 300)),
                new Promise(r => setTimeout(() => spinReel(document.getElementById('reel3'), 3000, result3).then(r), 600))
            ]);
            
            // 恢复状态灯
            document.querySelectorAll('.light').forEach((l, i) => {
                l.classList.toggle('on', i % 2 === 0);
            });
            
            checkWin([result1, result2, result3]);
            
            spinning = false;
            btn.disabled = false;
            btn.textContent = 'SPIN';
            
            if (balance <= 0) {
                setTimeout(() => {
                    if (confirm('💸 破产了！要重新开始吗？')) {
                        balance = 1000;
                        updateDisplay();
                        showMessage('重新开始！余额 $1000');
                    }
                }, 1000);
            }
        }
        
        function checkWin(results) {
            const combo = results.join('');
            const [a, b, c] = results;
            let winAmount = 0, message = '', multiplier = 0;
            
            if (payouts[combo]) {
                multiplier = payouts[combo];
                winAmount = currentBet * multiplier;
                message = `🎉 JACKPOT! ${combo} WIN $${winAmount}!`;
            } else if (a === b || b === c || a === c) {
                multiplier = 1;
                winAmount = currentBet;
                message = `WIN! RETURN $${winAmount}`;
            } else {
                message = 'TRY AGAIN!';
            }
            
            if (winAmount > 0) {
                balance += winAmount;
                showMessage(message, 'win');
                launchFireworks(multiplier);
            } else {
                showMessage(message, 'lose');
            }
            updateDisplay();
        }
        
        function launchFireworks(m) {
            if (m >= 50) {
                const end = Date.now() + 3000;
                const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff0066'];
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
                setTimeout(() => confetti({ particleCount: 150, spread: 180, origin: { y: 0.6 }, colors }), 500);
            } else if (m >= 20) {
                confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 }, colors: ['#ff00ff', '#00ffff'] });
            } else if (m >= 10) {
                confetti({ particleCount: 60, spread: 80, origin: { y: 0.6 }, colors: ['#00ff88', '#00ffff'] });
            } else if (m >= 5) {
                confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 }, colors: ['#00ff88'] });
            } else {
                confetti({ particleCount: 25, spread: 50, origin: { y: 0.8 } });
            }
        }
        
        function showMessage(msg, type = '') {
            document.getElementById('message').textContent = msg;
            document.getElementById('message').className = 'message ' + type;
        }
        
        function updateDisplay() {
            document.getElementById('balance').textContent = balance;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 王老师老虎机</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('casino-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: -1;
        }
        .machine {
            background: linear-gradient(145deg, rgba(139,0,0,0.95) 0%, rgba(220,20,60,0.95) 50%, rgba(139,0,0,0.95) 100%);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 100px rgba(255,215,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 3px solid #FFD700;
        }
        .title {
            color: #FFD700;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            animation: glow 2s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700, 0 0 30px #FFD700; }
            50% { text-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700, 0 0 60px #FFD700; }
        }
        .display {
            background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 4px solid #FFD700;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(255,215,0,0.2);
        }
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: linear-gradient(145deg, #333 0%, #222 100%);
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #444;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .reel-window {
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, #fff 0%, #e0e0e0 100%);
            border-radius: 10px;
            border: 3px solid #FFD700;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3), inset 0 0 10px rgba(0,0,0,0.1);
        }
        .reel-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            background: linear-gradient(145deg, #fff 0%, #f0f0f0 100%);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            transition: transform 0.1s linear;
        }
        .reel-content.spinning {
            animation: blur-spin 0.1s linear infinite;
        }
        @keyframes blur-spin {
            0% { filter: blur(0px); transform: scale(1); }
            50% { filter: blur(2px); transform: scale(0.95); }
            100% { filter: blur(0px); transform: scale(1); }
        }
        .info {
            display: flex;
            justify-content: space-between;
            color: #FFD700;
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .bet-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 25px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-bet {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
        }
        .btn-bet:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 6px 20px rgba(76,175,80,0.4);
        }
        .btn-bet.active {
            background: linear-gradient(145deg, #FFD700, #FFA500);
            color: #000;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        .btn-spin {
            background: linear-gradient(145deg, #FF6B6B, #EE5A6F);
            color: white;
            font-size: 1.5em;
            padding: 20px 40px;
            border: 2px solid #FFD700;
            box-shadow: 0 0 30px rgba(255,107,107,0.5);
        }
        .btn-spin:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,107,107,0.6);
        }
        .btn-spin:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .message {
            text-align: center;
            color: #FFD700;
            font-size: 1.4em;
            min-height: 30px;
            margin-top: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .message.win { color: #00FF00; animation: pulse 0.5s ease-in-out 3; }
        .message.lose { color: #FF6B6B; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .paytable {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 10px;
            color: #FFD700;
            border: 2px solid #FFD700;
        }
        .paytable h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #FFD700;
        }
        .paytable-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,215,0,0.3);
        }
        @media (max-width: 600px) {
            .reel-window { width: 80px; height: 80px; }
            .reel-content { font-size: 2.5em; }
            .title { font-size: 2em; }
            .machine { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="machine">
        <h1 class="title">🎰 王老师老虎机</h1>
        <div class="display">
            <div class="reels-container">
                <div class="reel-window"><div class="reel-content" id="reel1">🎰</div></div>
                <div class="reel-window"><div class="reel-content" id="reel2">🎰</div></div>
                <div class="reel-window"><div class="reel-content" id="reel3">🎰</div></div>
            </div>
            <div class="info">
                <span>💰 余额: $<span id="balance">1000</span></span>
                <span>🎯 下注: $<span id="currentBet">10</span></span>
            </div>
        </div>
        <div class="controls">
            <div class="bet-controls">
                <button class="btn btn-bet" onclick="setBet(5)">$5</button>
                <button class="btn btn-bet active" onclick="setBet(10)">$10</button>
                <button class="btn btn-bet" onclick="setBet(25)">$25</button>
                <button class="btn btn-bet" onclick="setBet(50)">$50</button>
                <button class="btn btn-bet" onclick="setBet(100)">$100</button>
            </div>
            <button class="btn btn-spin" id="spinBtn" onclick="spin()">🎲 开始旋转</button>
            <div class="message" id="message">选择下注金额，点击旋转！</div>
        </div>
        <div class="paytable">
            <h3>📋 赔率表</h3>
            <div class="paytable-item"><span>🎰🎰🎰 777</span><span>50倍</span></div>
            <div class="paytable-item"><span>💎💎💎 钻石</span><span>20倍</span></div>
            <div class="paytable-item"><span>7️⃣7️⃣7️⃣ 数字7</span><span>10倍</span></div>
            <div class="paytable-item"><span>🍒🍒🍒 樱桃</span><span>5倍</span></div>
            <div class="paytable-item"><span>🍋🍋🍋 柠檬</span><span>3倍</span></div>
            <div class="paytable-item"><span>🍊🍊🍊 橙子</span><span>2倍</span></div>
            <div class="paytable-item"><span>任意两个相同</span><span>1倍（返还）</span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        let balance = 1000;
        let currentBet = 10;
        let spinning = false;
        
        const symbols = ['🎰', '💎', '7️⃣', '🍒', '🍋', '🍊', '🍇', '🔔'];
        const payouts = { '🎰🎰🎰': 50, '💎💎💎': 20, '7️⃣7️⃣7️⃣': 10, '🍒🍒🍒': 5, '🍋🍋🍋': 3, '🍊🍊🍊': 2 };
        
        function setBet(amount) {
            if (spinning) return;
            currentBet = amount;
            document.getElementById('currentBet').textContent = amount;
            document.querySelectorAll('.btn-bet').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function getRandomSymbol() {
            const weights = [0.03, 0.06, 0.09, 0.18, 0.22, 0.24, 0.15, 0.03];
            let random = Math.random(), sum = 0;
            for (let i = 0; i < symbols.length; i++) {
                sum += weights[i];
                if (random <= sum) return symbols[i];
            }
            return symbols[0];
        }
        
        async function spin() {
            if (spinning) return;
            if (balance < currentBet) {
                showMessage('余额不足！', 'lose');
                return;
            }
            
            spinning = true;
            balance -= currentBet;
            updateDisplay();
            
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.textContent = '🎲 旋转中...';
            showMessage('祝你好运！🍀');
            
            const reel1 = document.getElementById('reel1');
            const reel2 = document.getElementById('reel2');
            const reel3 = document.getElementById('reel3');
            
            // 先生成最终结果
            const result1 = getRandomSymbol();
            const result2 = getRandomSymbol();
            const result3 = getRandomSymbol();
            
            // 添加旋转模糊效果
            reel1.classList.add('spinning');
            reel2.classList.add('spinning');
            reel3.classList.add('spinning');
            
            // 快速切换符号模拟滚动
            let count = 0;
            const maxCount = 30;
            const interval = setInterval(() => {
                reel1.textContent = getRandomSymbol();
                reel2.textContent = getRandomSymbol();
                reel3.textContent = getRandomSymbol();
                count++;
                if (count >= maxCount) clearInterval(interval);
            }, 80);
            
            // 第一个停止
            await new Promise(r => setTimeout(r, 1200));
            clearInterval(interval);
            reel1.classList.remove('spinning');
            reel1.textContent = result1;
            reel1.style.transform = 'scale(1.1)';
            setTimeout(() => reel1.style.transform = 'scale(1)', 150);
            
            // 第二个停止
            await new Promise(r => setTimeout(r, 400));
            reel2.classList.remove('spinning');
            reel2.textContent = result2;
            reel2.style.transform = 'scale(1.1)';
            setTimeout(() => reel2.style.transform = 'scale(1)', 150);
            
            // 第三个停止
            await new Promise(r => setTimeout(r, 400));
            reel3.classList.remove('spinning');
            reel3.textContent = result3;
            reel3.style.transform = 'scale(1.1)';
            setTimeout(() => reel3.style.transform = 'scale(1)', 150);
            
            const results = [result1, result2, result3];
            checkWin(results);
            
            spinning = false;
            btn.disabled = false;
            btn.textContent = '🎲 开始旋转';
            
            if (balance <= 0) {
                setTimeout(() => {
                    if (confirm('💸 破产了！要重新开始吗？')) {
                        balance = 1000;
                        updateDisplay();
                        showMessage('重新开始！余额 $1000');
                    }
                }, 1000);
            }
        }
        
        function checkWin(results) {
            const combo = results.join('');
            const [a, b, c] = results;
            let winAmount = 0, message = '', multiplier = 0;
            
            if (payouts[combo]) {
                multiplier = payouts[combo];
                winAmount = currentBet * multiplier;
                message = `🎉 大奖！${combo}！赢得 $${winAmount}！`;
            } else if (a === b || b === c || a === c) {
                multiplier = 1;
                winAmount = currentBet;
                message = `🙂 小奖！两个相同，返还 $${winAmount}`;
            } else {
                message = '😔 没有中奖，再试一次！';
            }
            
            if (winAmount > 0) {
                balance += winAmount;
                showMessage(message, 'win');
                launchFireworks(multiplier);
            } else {
                showMessage(message, 'lose');
            }
            updateDisplay();
        }
        
        function launchFireworks(multiplier) {
            if (multiplier >= 50) {
                const duration = 3000, end = Date.now() + duration;
                const colors = ['#FFD700', '#FF6B6B', '#4CAF50', '#2196F3', '#FF9800'];
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: colors });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: colors });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
                setTimeout(() => confetti({ particleCount: 150, spread: 180, origin: { y: 0.6 }, colors: colors }), 500);
            } else if (multiplier >= 20) {
                confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 }, colors: ['#FFD700', '#FFA500', '#FF6B6B'] });
                setTimeout(() => confetti({ particleCount: 80, spread: 120, origin: { y: 0.7 }, colors: ['#FFD700', '#FFA500'] }), 300);
            } else if (multiplier >= 10) {
                confetti({ particleCount: 60, spread: 80, origin: { y: 0.6 }, colors: ['#4CAF50', '#2196F3', '#FF9800'] });
            } else if (multiplier >= 5) {
                confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 }, colors: ['#4CAF50', '#81C784'] });
            } else {
                confetti({ particleCount: 25, spread: 50, origin: { y: 0.8 }, colors: ['#81C784'] });
            }
        }
        
        function showMessage(msg, type = '') {
            const messageEl = document.getElementById('message');
            messageEl.textContent = msg;
            messageEl.className = 'message ' + type;
        }
        
        function updateDisplay() {
            document.getElementById('balance').textContent = balance;
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); spin(); }
        });
    </script>
</body>
</html>
